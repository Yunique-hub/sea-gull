name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Windows 控制台默认 cp1252，中文/符号输出会炸；统一 UTF-8
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 静态检查
        shell: bash
        run: |
          set -e
          for f in install.sh update.sh verify.sh verify-e2e.sh tests/smoke.sh tests/run-bash.sh; do bash -n "$f"; echo "OK $f"; done
          python -m py_compile src/tools/patch_profile.py src/tools/managed_teams.py src/tools/configure_toolkit.py vendor/dsh-purge/lib/redteam/extract-tools.py

      - name: Windows 脚本必须保留 UTF-8 BOM
        shell: bash
        run: |
          set -e
          # install.ps1 / update.ps1 里有中文字面量。去掉 BOM 后 PS 5.1 会按 ANSI(cp936) 解码，
          # 中文字节吞掉引号边界 → 解析直接崩。BOM 是这两个文件的不变量，别"顺手清理"。
          for f in install.ps1 update.ps1; do
            head -c 3 "$f" | od -An -tx1 | tr -d ' \n' | grep -q '^efbbbf$' \
              || { echo "✗ $f 缺 UTF-8 BOM：PS 5.1 -File 会按 ANSI 解码中文并报解析错误"; exit 1; }
            echo "OK $f UTF-8 BOM"
          done

      - name: 一键安装文档禁止裸 irm | iex
        shell: bash
        run: |
          set -e
          # 脚本带 BOM，而 irm 不剥 BOM：裸管道会把 U+FEFF 送进 iex，
          # param() 块失配，报「赋值表达式无效」。远程管道必须 TrimStart([char]0xFEFF)。
          hits="$(grep -rnE '(install|update)\.ps1[^|]*\|\s*iex' README.md README.en.md docs/DEPLOY.md | grep -vE '不要写成|Do not use' || true)"
          if [ -n "$hits" ]; then
            echo "✗ 文档里出现裸 irm ... | iex："
            echo "$hits"
            echo "改用：iex ((irm <url> -UseBasicParsing).TrimStart([char]0xFEFF))"
            exit 1
          fi
          echo "一键安装命令均为 BOM 安全形式"

      - name: 禁止裸 python 调用（Windows 只装 py 启动器时整批假失败）
        shell: bash
        run: |
          set -e
          # tests/ 一律走 python-exec.mjs 解析，脚本一律带 py -3 回退。
          # 只看真正的代码行，注释里的示例不算违规。
          bad=0
          while IFS= read -r hit; do
            file="${hit%%:*}"
            rest="${hit#*:}"
            line="${rest%%:*}"
            src="$(sed -n "${line}p" "$file")"
            trimmed="${src#"${src%%[![:space:]]*}"}"
            case "$trimmed" in
              '#'*|'//'*|'*'*|'/*'*) continue ;;
            esac
            echo "✗ $hit"
            bad=1
          done < <(grep -rnE "spawnSync\(\s*['\"]python3?['\"]|process\.platform\s*===\s*'win32'\s*\?\s*'python3?'" tests/*.mjs || true)
          if [ "$bad" -ne 0 ]; then
            echo "✗ tests/ 里有裸 python 调用，请改用 tests/python-exec.mjs 的 resolvePython()/runPython()"
            exit 1
          fi
          echo "无裸 python 调用"

      - name: shellcheck
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S error install.sh update.sh verify.sh verify-e2e.sh tests/smoke.sh tests/run-bash.sh

      - name: 冒烟测试（假 DSH_HOME，装/验/幂等/卸 全闭环）
        shell: bash
        run: bash tests/smoke.sh

      - name: 0.2.1 兼容与更新回归
        shell: bash
        run: |
          node --test tests/*.test.mjs
          node --test vendor/dsh-purge/test/*.test.js

      - name: 产物完整性（一键装必须能定位全部资产）
        shell: bash
        run: |
          set -e
          for p in VERSION LICENSE NOTICE README.md install.sh install.ps1 update.sh update.ps1 verify.sh verify.ps1 \
                   src/prompt/prompt-inject.md vendor/dsh-purge/lib/default-prompt-inject.md \
                   docs/archive/seagull-fullbreak-1.0.7.json \
                   src/tools/patch_profile.py src/tools/managed_teams.py src/tools/configure_toolkit.py \
                   vendor/dsh-agent-teams/package.json vendor/dsh-agent-teams/LICENSE vendor/dsh-agent-teams/lib/index.js vendor/dsh-agent-teams/lib/client.js \
                   vendor/dsh-purge/lib/redteam/tool-releases.json src/skills/redteam vendor/dsh-purge/lib/index.js \
                   vendor/dsh-purge/LICENSE vendor/dsh-purge/NOTICE vendor/dsh-purge/LICENSE-COMMERCIAL.md; do
            [ -e "$p" ] || { echo "缺: $p"; exit 1; }
          done
          echo "产物完整"

  plugin-syntax:
    name: vendor 插件语法
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --check
        run: |
          set -e
          for f in vendor/dsh-purge/bin/dsh-purge.js \
                   vendor/dsh-purge/client.js \
                   vendor/dsh-purge/lib/index.js \
                   vendor/dsh-purge/lib/core.js \
                   vendor/dsh-purge/lib/identity.js \
                   vendor/dsh-purge/lib/desktop.js \
                   vendor/dsh-purge/lib/redteam/index.js \
                   vendor/dsh-purge/lib/redteam/preset-composition.js \
                   vendor/dsh-purge/lib/redteam/store-core.js \
                   vendor/dsh-purge/lib/redteam/evidence-ledger.mjs \
                   vendor/dsh-purge/scripts/ensure-profile-bundle.mjs \
                   vendor/dsh-purge/lib/preset-default.js \
                   vendor/dsh-purge/lib/mnemon-settings.js \
                   vendor/dsh-purge/lib/reapply.js \
                   vendor/dsh-purge/lib/net-scope.js \
                   vendor/dsh-purge/lib/redteam/tool-installer.js vendor/dsh-purge/lib/redteam/ui.js \
                   vendor/dsh-purge/lib/seagull-language.js \
                   vendor/dsh-agent-teams/lib/index.js vendor/dsh-agent-teams/lib/command.js vendor/dsh-agent-teams/lib/client.js; do
            node --check "$f" && echo "OK $f"
          done
      - name: JSON 合法
        run: |
          set -e
          for f in vendor/dsh-purge/package.json vendor/dsh-agent-teams/compatibility.json docs/archive/seagull-fullbreak-1.0.7.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "OK $f"
          done

  # Windows 官方安装只放 py 启动器，PATH 里没有 python/python3。
  # 这类机器上一度整批测试假失败（30+ 红），看起来像产品炸了。
  # 这里刻意不 setup-python，只靠 py 启动器跑一遍关键回归。
  py-only:
    name: py 启动器（无 python 命令）
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 确认环境确实没有 python 命令
        shell: pwsh
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          $python3 = Get-Command python3 -ErrorAction SilentlyContinue
          if ($python -or $python3) {
            Write-Host "! 该 runner 自带 python，本作业失去意义；跳过断言但仍跑回归。"
          } else {
            Write-Host "✓ 无 python/python3，只有 py 启动器"
          }
          Get-Command py -ErrorAction SilentlyContinue | Format-List Source

      - name: python-exec 解析与关键回归
        shell: pwsh
        run: |
          node --test tests/python-exec.test.mjs tests/version-sync.test.mjs tests/agent-teams-compat.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 安装器在 py-only 环境下不误报缺 python
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $tmp = Join-Path $env:TEMP ("seagull-pyonly-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path (Join-Path $tmp "profiles/desktop") -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $tmp "profiles/desktop/package.json") -Value '{"dependencies":{},"dsh":{"profile":{"bundles":[]}}}'
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -DshHome $tmp -AppRoot (Join-Path $tmp "nope") -Profile desktop -NoPnpm -DryRun 2>&1 | Tee-Object -Variable out
          if ($out -match "需要 python") { Write-Host "✗ py-only 环境下仍报缺 python"; exit 1 }
          Write-Host "✓ 未误报缺 python"
