name: Feature request
description: 提一个可验证的工程改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述现状、影响面和可复现证据
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案
      description: 尽量给命令、文件、验收标准；不要只写“优化一下”
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 是否改宿主、persona、vendor、安装器、运行副本
  - type: checkboxes
    id: checks
    attributes:
      label: 已确认
      options:
        - label: 方案不包含私密数据、账号或凭据
          required: true